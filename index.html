<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VCE Organiser</title>
  <meta name="description" content="Organiser for a Year 11 VCE student — events, tests, homework, calendar and reminders." />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VCE Organiser" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">📚</span>
      <div>
        <h1>VCE Organiser</h1>
        <p class="tagline">Events · Tests · Homework</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="sync-btn" class="btn btn-ghost" type="button" title="Cloud sync">
        <span class="sync-icon" aria-hidden="true">☁</span> <span class="btn-label">Sync</span>
      </button>
      <button id="enable-reminders" class="btn btn-ghost" type="button" title="Turn on desktop reminders">
        🔔 <span class="btn-label">Enable reminders</span>
      </button>
      <button id="manage-subjects" class="btn btn-ghost" type="button">🎨 <span class="btn-label">Subjects</span></button>
      <button id="add-item" class="btn btn-primary" type="button">＋ <span class="btn-label">Add</span></button>
    </div>
  </header>

  <!-- AI quick-add: speak or type a sentence, Claude turns it into scheduled items -->
  <section class="quick-add card" aria-labelledby="qa-heading">
    <div class="qa-head">
      <h2 id="qa-heading">✨ Quick add</h2>
    </div>
    <form id="qa-form" class="qa-bar">
      <input id="qa-input" type="text" autocomplete="off"
             placeholder="Type or speak, e.g. “physics exam on the 30th of July”" />
      <button id="qa-mic" class="btn btn-ghost btn-icon qa-mic" type="button" title="Speak" aria-label="Speak">🎤</button>
      <button id="qa-submit" class="btn btn-primary" type="submit">Add</button>
    </form>
    <p class="qa-hint">Try “politics questions 3 and 4 tonight”, “biology SAC next Monday”, or “history test on the 28th”.</p>
    <div id="qa-result" class="qa-result" hidden></div>
  </section>

  <main class="layout">
    <!-- Dashboard: due soon -->
    <section class="dashboard card" aria-labelledby="dash-heading">
      <h2 id="dash-heading">Due soon</h2>
      <div id="dashboard-body" class="dashboard-body">
        <!-- filled by app.js -->
      </div>
    </section>

    <!-- Calendar -->
    <section class="calendar card" aria-labelledby="cal-heading">
      <div class="calendar-toolbar">
        <div class="cal-nav">
          <button id="cal-prev" class="btn btn-ghost btn-icon" type="button" aria-label="Previous month">‹</button>
          <button id="cal-today" class="btn btn-ghost" type="button">Today</button>
          <button id="cal-next" class="btn btn-ghost btn-icon" type="button" aria-label="Next month">›</button>
        </div>
        <h2 id="cal-heading" class="cal-title"><!-- Month YYYY --></h2>
        <div class="cal-legend" id="cal-legend"><!-- subject legend --></div>
      </div>
      <div class="weekday-row" aria-hidden="true">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="Calendar">
        <!-- filled by app.js -->
      </div>
    </section>
  </main>

  <!-- Add / Edit item modal -->
  <div id="item-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal="item-modal"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="item-modal-title">
      <div class="modal-head">
        <h2 id="item-modal-title">Add item</h2>
        <button class="btn btn-ghost btn-icon" type="button" data-close-modal="item-modal" aria-label="Close">✕</button>
      </div>
      <form id="item-form" class="modal-form">
        <input type="hidden" id="item-id" />

        <div class="field">
          <label for="item-type">Type</label>
          <div class="segmented" id="item-type-seg" role="radiogroup" aria-label="Type">
            <label><input type="radio" name="item-type" value="homework" checked /> <span>📝 Homework</span></label>
            <label><input type="radio" name="item-type" value="test" /> <span>🧪 Test</span></label>
            <label><input type="radio" name="item-type" value="event" /> <span>📅 Event</span></label>
          </div>
        </div>

        <div class="field">
          <label for="item-title">Title</label>
          <input type="text" id="item-title" required placeholder="e.g. Methods Ch. 4 exercises" maxlength="120" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="item-subject">Subject</label>
            <select id="item-subject"></select>
          </div>
          <div class="field">
            <label for="item-reminder">Remind me</label>
            <select id="item-reminder">
              <option value="0">At due time</option>
              <option value="10">10 min before</option>
              <option value="30">30 min before</option>
              <option value="60" selected>1 hour before</option>
              <option value="120">2 hours before</option>
              <option value="1440">1 day before</option>
              <option value="2880">2 days before</option>
              <option value="-1">No reminder</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="item-date">Date</label>
            <input type="date" id="item-date" required />
          </div>
          <div class="field">
            <label for="item-time">Time</label>
            <input type="time" id="item-time" value="09:00" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="item-recurrence">Repeats</label>
            <select id="item-recurrence">
              <option value="none" selected>Does not repeat</option>
              <option value="daily">Every day</option>
              <option value="weekly">Every week</option>
              <option value="monthly">Every month</option>
            </select>
          </div>
          <div class="field" id="recurrence-until-field" hidden>
            <label for="item-recurrence-until">Repeat until</label>
            <input type="date" id="item-recurrence-until" />
          </div>
        </div>

        <div class="field">
          <label for="item-notes">Notes</label>
          <textarea id="item-notes" rows="2" placeholder="Optional details…" maxlength="500"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" id="item-delete" class="btn btn-danger" hidden>Delete</button>
          <span class="spacer"></span>
          <button type="button" class="btn btn-ghost" data-close-modal="item-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Subjects modal -->
  <div id="subjects-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal="subjects-modal"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="subjects-modal-title">
      <div class="modal-head">
        <h2 id="subjects-modal-title">Subjects</h2>
        <button class="btn btn-ghost btn-icon" type="button" data-close-modal="subjects-modal" aria-label="Close">✕</button>
      </div>
      <div class="modal-form">
        <p class="hint">Colour-code your VCE subjects. Colours show up on the calendar and dashboard.</p>
        <ul id="subject-list" class="subject-list"></ul>
        <form id="add-subject-form" class="add-subject-row">
          <input type="text" id="new-subject-name" placeholder="Add a subject…" maxlength="40" />
          <input type="color" id="new-subject-color" value="#4f46e5" aria-label="Subject colour" />
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Day detail modal -->
  <div id="day-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal="day-modal"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="day-modal-title">
      <div class="modal-head">
        <h2 id="day-modal-title">Day</h2>
        <button class="btn btn-ghost btn-icon" type="button" data-close-modal="day-modal" aria-label="Close">✕</button>
      </div>
      <div class="modal-form">
        <ul id="day-items" class="day-items"></ul>
        <button type="button" id="day-add" class="btn btn-primary full">＋ Add to this day</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="firebase-config.js"></script>
  <script src="sync.js"></script>
  <script src="quickadd.js"></script>
  <script src="app.js"></script>
</body>
</html>
